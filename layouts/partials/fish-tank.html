<!-- layouts/partials/fish-tank.html -->
<div class="fish-tank-widget" id="fishTankWidget" data-off="true">
  <button class="tank-toggle" id="tankToggle" aria-label="Toggle fish tank" aria-pressed="false">
    <span class="tank-toggle-track"><span class="tank-toggle-thumb"></span></span>
  </button>
  <div class="bubbles" id="bubbles"></div>
  <div class="fish-layer" id="fishLayer"></div>
  <div class="tank-plants">
    <div class="plant plant-1"></div>
    <div class="plant plant-2"></div>
    <div class="plant plant-3"></div>
  </div>
</div>

<script>
(function () {
  const FISH_COLORS = [
    { light: "#5fb8ff", dark: "#1e90ff", fin: "#00bfff" },
    { light: "#ff9dd0", dark: "#ff69b4", fin: "#ff8ac6" },
    { light: "#c6ff5c", dark: "#9fef00", fin: "#b6f23a" },
    { light: "#ffc766", dark: "#f5a623", fin: "#ffb84d" },
    { light: "#ff8a80", dark: "#ef5350", fin: "#ff6f66" }
  ];
  const SHARK_COLOR = { light: "#9fb3c4", dark: "#48586a", fin: "#3a4753" };

  const fishLayer = document.getElementById('fishLayer');
  if (!fishLayer) return;

  const tankWidget = document.getElementById('fishTankWidget');
  const tankToggle = document.getElementById('tankToggle');
  if (tankToggle && tankWidget) {
    tankToggle.addEventListener('click', function () {
      const isOn = tankWidget.getAttribute('data-off') !== 'true';
      tankWidget.setAttribute('data-off', isOn ? 'true' : 'false');
      tankToggle.setAttribute('aria-pressed', isOn ? 'false' : 'true');
    });
  }

  const FISH_COUNT = 6;
  const bounds = { left: [-20, 85], top: [4, 82] }; // % of tank, allows roaming past the narrow strip
  const EAT_RADIUS = 16;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function fishSVG(i, c) {
    return `
      <svg viewBox="0 -6 64 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fishGrad${i}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${c.light}"/>
            <stop offset="100%" stop-color="${c.dark}"/>
          </linearGradient>
        </defs>
        <path class="fin-tail" d="M2,16 L17,5 L12,16 L17,27 Z" fill="${c.fin}" opacity="0.9"/>
        <ellipse cx="38" cy="16" rx="24" ry="11" fill="url(#fishGrad${i})"/>
        <ellipse cx="38" cy="20" rx="17" ry="4.5" fill="rgba(255,255,255,0.18)"/>
        <path d="M30,5 L38,-4 L43,6 Z" fill="${c.fin}" opacity="0.85"/>
        <path class="fin-pec" d="M34,22 L27,32 L41,26 Z" fill="${c.fin}" opacity="0.8"/>
        <path d="M46,7 Q44,16 46,25" stroke="rgba(0,0,0,0.25)" stroke-width="1.2" fill="none"/>
        <circle cx="54" cy="13" r="3.2" fill="#111"/>
        <circle cx="55" cy="12" r="1" fill="#fff"/>
      </svg>`;
  }

  function sharkSVG(c) {
    return `
      <svg viewBox="0 -10 96 56" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sharkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${c.light}"/>
            <stop offset="100%" stop-color="${c.dark}"/>
          </linearGradient>
        </defs>
        <path class="fin-tail" d="M2,26 L22,10 L14,26 L22,42 Z" fill="${c.fin}" opacity="0.95"/>
        <ellipse cx="52" cy="26" rx="34" ry="15" fill="url(#sharkGrad)"/>
        <ellipse cx="52" cy="33" rx="24" ry="6" fill="rgba(255,255,255,0.22)"/>
        <path d="M40,11 L52,-9 L61,12 Z" fill="${c.fin}"/>
        <path class="fin-pec" d="M46,34 L36,50 L59,40 Z" fill="${c.fin}" opacity="0.9"/>
        <path d="M64,10 Q68,18 64,26 M68,11 Q72,18 68,25" stroke="rgba(0,0,0,0.25)" stroke-width="1.4" fill="none"/>
        <polygon points="78,20 82,24 78,28 84,28 88,24 84,20" fill="#eee"/>
        <circle cx="76" cy="16" r="3" fill="#111"/>
        <circle cx="77" cy="15" r="1" fill="#fff"/>
      </svg>`;
  }

  /* ---------- fish ---------- */
  const fishState = [];
  for (let i = 0; i < FISH_COUNT; i++) {
    const c = FISH_COLORS[i % FISH_COLORS.length];
    const size = 0.8 + Math.random() * 0.5;

    const wrap = document.createElement('div');
    wrap.className = 'fish';
    wrap.innerHTML = `<div class="fish-flip"><div class="fish-bob">${fishSVG(i, c)}</div></div>`;
    fishLayer.appendChild(wrap);

    const startLeft = bounds.left[0] + Math.random() * (bounds.left[1] - bounds.left[0]);
    const startTop = bounds.top[0] + Math.random() * (bounds.top[1] - bounds.top[0]);
    wrap.style.left = startLeft + '%';
    wrap.style.top = startTop + '%';

    const flipEl = wrap.querySelector('.fish-flip');
    flipEl.style.transform = `scaleX(${size}) scaleY(${size})`;

    const state = { wrap, flipEl, size, left: startLeft, top: startTop, eaten: false, color: c };
    fishState.push(state);
    scheduleFishMove(state, 300 + Math.random() * 1500);
  }

  function scheduleFishMove(state, delay) {
    setTimeout(function () { moveFish(state); }, delay);
  }

  function moveFish(state) {
    if (state.eaten) return;
    const newLeft = bounds.left[0] + Math.random() * (bounds.left[1] - bounds.left[0]);
    const newTop = bounds.top[0] + Math.random() * (bounds.top[1] - bounds.top[0]);
    const duration = travelTo(state, newLeft, newTop, 10);
    const pause = 300 + Math.random() * 1200;
    scheduleFishMove(state, duration * 1000 + pause);
  }

  function spawnBiteBurst(left, top, color) {
    const ring = document.createElement('div');
    ring.className = 'impact-ring';
    ring.style.left = left + '%';
    ring.style.top = top + '%';
    fishLayer.appendChild(ring);
    setTimeout(() => ring.remove(), 450);

    const colors = [color.light, color.dark, '#ffffff'];
    for (let p = 0; p < 6; p++) {
      const particle = document.createElement('div');
      particle.className = 'bite-particle';
      particle.style.left = left + '%';
      particle.style.top = top + '%';
      particle.style.background = colors[p % colors.length];
      const angle = Math.random() * Math.PI * 2;
      const dist = 14 + Math.random() * 18;
      particle.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      particle.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      fishLayer.appendChild(particle);
      setTimeout(() => particle.remove(), 500);
    }
  }

  function eatFish(state) {
    if (state.eaten) return;
    state.eaten = true;

    // shark chomps
    const pulseEl = sharkState.wrap.querySelector('.shark-pulse');
    pulseEl.classList.add('chomp');
    setTimeout(() => pulseEl.classList.remove('chomp'), 320);

    // fish gets snapped toward the shark's mouth
    state.wrap.style.transitionDuration = '0.15s';
    state.wrap.style.left = sharkState.left + '%';
    state.wrap.style.top = sharkState.top + '%';

    setTimeout(() => {
      spawnBiteBurst(sharkState.left, sharkState.top, state.color);
      state.wrap.classList.add('fish-eaten');
      setTimeout(() => { state.wrap.style.display = 'none'; }, 320);
    }, 150);

    const respawnDelay = 150 + 320 + 2000 + Math.random() * 3000;
    setTimeout(() => respawnFish(state), respawnDelay);
  }

  function respawnFish(state) {
    const newLeft = bounds.left[0] + Math.random() * (bounds.left[1] - bounds.left[0]);
    const newTop = bounds.top[0] + Math.random() * (bounds.top[1] - bounds.top[0]);
    state.wrap.style.transitionDuration = '0s';
    state.wrap.style.left = newLeft + '%';
    state.wrap.style.top = newTop + '%';
    state.left = newLeft;
    state.top = newTop;
    state.wrap.classList.remove('fish-eaten');
    state.wrap.style.display = '';
    requestAnimationFrame(() => {
      state.eaten = false;
      scheduleFishMove(state, 400 + Math.random() * 1200);
    });
  }

  /* ---------- shared travel helper ---------- */
  function travelTo(state, newLeft, newTop, speed) {
    const dx = newLeft - state.left;
    const dy = newTop - state.top;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const duration = Math.max(1.2, Math.min(5, dist / speed * 8));
    const dir = dx < 0 ? -1 : 1;

    state.flipEl.style.transform = `scaleX(${state.size * dir}) scaleY(${state.size})`;
    state.wrap.style.transitionDuration = duration + 's';
    state.wrap.style.left = newLeft + '%';
    state.wrap.style.top = newTop + '%';
    state.left = newLeft;
    state.top = newTop;
    return duration;
  }

  /* ---------- shark ---------- */
  const sharkWrap = document.createElement('div');
  sharkWrap.className = 'shark';
  sharkWrap.innerHTML = `<div class="shark-flip"><div class="shark-pulse"><div class="shark-bob">${sharkSVG(SHARK_COLOR)}</div></div></div>`;
  fishLayer.appendChild(sharkWrap);

  const sharkStart = {
    left: bounds.left[0] + Math.random() * (bounds.left[1] - bounds.left[0]),
    top: bounds.top[0] + Math.random() * (bounds.top[1] - bounds.top[0])
  };
  sharkWrap.style.left = sharkStart.left + '%';
  sharkWrap.style.top = sharkStart.top + '%';

  const sharkState = {
    wrap: sharkWrap,
    flipEl: sharkWrap.querySelector('.shark-flip'),
    size: 1,
    left: sharkStart.left,
    top: sharkStart.top
  };
  sharkState.flipEl.style.transform = 'scaleX(1) scaleY(1)';

  scheduleSharkMove(1000);

  function scheduleSharkMove(delay) {
    setTimeout(moveShark, delay);
  }

  function moveShark() {
    const alive = fishState.filter(f => !f.eaten);
    let targetLeft, targetTop;
    if (alive.length && Math.random() < 0.75) {
      const target = alive[Math.floor(Math.random() * alive.length)];
      targetLeft = clamp(target.left + (Math.random() * 10 - 5), bounds.left[0], bounds.left[1]);
      targetTop = clamp(target.top + (Math.random() * 10 - 5), bounds.top[0], bounds.top[1]);
    } else {
      targetLeft = bounds.left[0] + Math.random() * (bounds.left[1] - bounds.left[0]);
      targetTop = bounds.top[0] + Math.random() * (bounds.top[1] - bounds.top[0]);
    }
    const duration = travelTo(sharkState, targetLeft, targetTop, 16);
    const pause = 150 + Math.random() * 600;
    scheduleSharkMove(duration * 1000 + pause);
  }

  /* ---------- eating check ---------- */
  setInterval(() => {
    fishState.forEach(f => {
      if (f.eaten) return;
      const dx = f.left - sharkState.left;
      const dy = f.top - sharkState.top;
      if (Math.sqrt(dx * dx + dy * dy) < EAT_RADIUS) eatFish(f);
    });
  }, 350);

  /* ---------- bubbles ---------- */
  const bubbleLayer = document.getElementById('bubbles');
  setInterval(() => {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = (10 + Math.random() * 80) + '%';
    b.style.setProperty('--drift', (Math.random() * 20 - 10) + 'px');
    b.style.animationDuration = (3 + Math.random() * 3) + 's';
    bubbleLayer.appendChild(b);
    setTimeout(() => b.remove(), 6500);
  }, 900);
})();
</script>
